name: Deploy Aerovy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aerovy-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ddotsmedia/aerovy-travels/web

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull, restart and health-check on VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            mkdir -p /opt/aerovy
            cd /opt/aerovy

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u ddotsmedia --password-stdin
            fi

            docker pull ghcr.io/ddotsmedia/aerovy-travels/web:latest

            docker stop aerovy-web || true
            docker rm aerovy-web || true
            docker run -d --name aerovy-web --restart unless-stopped \
              -p 127.0.0.1:3130:3130 \
              ghcr.io/ddotsmedia/aerovy-travels/web:latest

            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:3130; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            docker logs --tail 100 aerovy-web || true
            exit 1

      - name: Configure nginx reverse proxy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if [ ! -f /etc/nginx/sites-enabled/aerovy.ae ]; then
              cat > /etc/nginx/sites-enabled/aerovy.ae << 'EOF'
            server {
              listen 80;
              server_name aerovy.ae www.aerovy.ae;
              location / {
                proxy_pass http://127.0.0.1:3130;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
              }
            }
            EOF
              nginx -t && systemctl reload nginx
            fi
